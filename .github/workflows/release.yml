# Publishes a tagged release to PyPI with Trusted Publishing (OIDC).
# No API token is stored in this repository.
# Runs only when a GitHub release is published.
name: Release to PyPI

"on":
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Test and build the distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run the pytest gate before publishing
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pytest

      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }

      - name: Build sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Upload the distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/llm-redteam-banking-checklist/
    permissions:
      id-token: write
    steps:
      - name: Download the distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.3
